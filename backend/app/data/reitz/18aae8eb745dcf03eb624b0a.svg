  </g>

  <!-- Chess Piece 3: King -->
  <g transform="translate(520, 200)">
    <path d="M20 140 L80 140 L75 70 L60 50 L40 50 L25 70 Z" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <rect x="45" y="20" width="10" height="30" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <rect x="35" y="30" width="30" height="10" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="50" cy="75" r="20" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="45" cy="70" r="4" fill="#3B2A1E"/>
    <circle cx="55" cy="70" r="4" fill="#3B2A1E"/>
    <path d="M45 80 Q 50 85 55 80" stroke="#3B2A1E" stroke-width="3" fill="none"/>
  </g>
