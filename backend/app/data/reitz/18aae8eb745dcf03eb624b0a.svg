<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 468">
  <!-- Background -->
  <rect width="768" height="468" fill="#F4EBD9"/>
  <rect y="234" width="768" height="234" fill="#E6DCC5"/>
  
  <!-- Glowing Plate -->
  <ellipse cx="384" cy="330" rx="350" ry="60" fill="#FFFFFF" fill-opacity="0.4"/>
  
  <!-- Chessboard Grid -->
  <path d="M0 330 L768 330 M192 280 L192 380 M384 280 L384 380 M576 280 L576 380" stroke="#D1C7B0" stroke-width="4"/>

  <!-- Chess Piece 1: Pawn -->
  <g transform="translate(150, 240)">
    <path d="M20 100 Q 20 50 40 40 Q 60 50 60 100 Z" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="40" cy="35" r="25" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="33" cy="30" r="5" fill="#3B2A1E"/>
    <circle cx="47" cy="30" r="5" fill="#3B2A1E"/>
    <path d="M35 45 Q 40 48 45 45" stroke="#3B2A1E" stroke-width="3" fill="none"/>
  </g>

  <!-- Chess Piece 2: Knight -->
  <g transform="translate(330, 220)">
    <path d="M20 120 L80 120 L70 60 L40 40 L20 80 Z" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="50" cy="50" r="25" fill="#FFF" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="43" cy="45" r="5" fill="#3B2A1E"/>
    <circle cx="57" cy="45" r="5" fill="#3B2A1E"/>
