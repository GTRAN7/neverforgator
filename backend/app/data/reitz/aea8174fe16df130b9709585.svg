<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 468">
  <defs>
    <filter id="whiteOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="8" in="SourceAlpha" result="expanded" />
      <feFlood flood-color="white" />
      <feComposite in2="expanded" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="768" height="468" fill="#FDEBD7" />
  <rect y="350" width="768" height="118" fill="#D6EAF8" />

  <!-- Television -->
  <g filter="url(#whiteOutline)" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="250" y="50" width="300" height="220" rx="20" fill="#FF5733" />
    <rect x="270" y="70" width="260" height="180" rx="10" fill="#2C3E50" />
    
    <!-- Screen content -->
    <circle cx="340" cy="150" r="40" fill="#FFD700" /> <!-- Phone -->
    <rect x="320" y="140" width="40" height="50" fill="#FFD700" />
    <path d="M330 160 l-10 10 m20 -10 l10 10" stroke="#3B2A1E" stroke-width="3" />
    
    <path d="M420 120 l50 20 l-50 20 z" fill="#FF69B4" /> <!-- Env 1 -->
    <path d="M420 180 l50 20 l-50 20 z" fill="#FF69B4" /> <!-- Env 2 -->
    <path d="M460 140 q20 20 0 40" stroke="#00FF00" stroke-width="6" fill="none" />
  </g>

  <!-- Person's hand -->
  <g filter="url(#whiteOutline)" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 160 l60 -20 l40 30" fill="#FAD7A0" />
    <circle cx="650" cy="170" r="15" fill="#FAD7A0" />
  </g>
</svg>