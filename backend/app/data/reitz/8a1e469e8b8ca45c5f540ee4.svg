<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 468">
  <!-- Background -->
  <rect width="768" height="468" fill="#E8F4F8"/>
  <rect x="0" y="350" width="768" height="118" fill="#D1E8F0"/>
  
  <!-- Recycling Bins -->
  <g fill="#4A90E2" stroke="#3B2A1E" stroke-width="5">
    <rect x="50" y="250" width="100" height="150" rx="10"/>
    <rect x="618" y="250" width="100" height="150" rx="10"/>
  </g>
  
  <!-- Person -->
  <g transform="translate(384, 200)">
    <circle cx="0" cy="0" r="40" fill="#FFD1A9" stroke="#3B2A1E" stroke-width="5"/>
    <path d="M-20 -10 Q-10 -20 0 -10 Q10 -20 20 -10" fill="none" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round"/>
    <path d="M-15 15 Q0 25 15 15" fill="none" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round"/>
    <rect x="-40" y="50" width="80" height="150" rx="20" fill="#FF9F1C" stroke="#3B2A1E" stroke-width="5"/>
  </g>

  <!-- Tiny Cyclist -->
  <g transform="translate(384, 320) scale(0.6)">
    <circle cx="0" cy="-20" r="20" fill="#FFD1A9" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="-30" cy="30" r="20" fill="#3B2A1E" stroke="#3B2A1E" stroke-width="5"/>
    <circle cx="30" cy="30" r="20" fill="#3B2A1E" stroke="#3B2A1E" stroke-width="5"/>
    <path d="M-10 10 L0 50 L10 10" fill="none" stroke="#3B2A1E" stroke-width="5"/>
  </g>

  <!-- Clay/Dolls -->
  <g transform="translate(384, 400)">
    <path d="M-60 -20 Q-30 -60 0 -20 Q30 -60 60 -20" fill="#3498DB" stroke="#3B2A1E" stroke-width="5" stroke-linejoin="round"/>
    <!-- Tiny Doll 1 -->
    <g transform="translate(-45, -50)">
      <circle cx="0" cy="0" r="15" fill="#3498DB" stroke="#3B2A1E" stroke-width="5"/>
      <rect x="-5" y="15" width="10" height="20" fill="#3498DB" stroke="#3B2A1E" stroke-width="5"/>
    </g>
    <!-- Tiny Doll 2 -->
    <g transform="translate(45, -50)">
      <circle cx="0" cy="0" r="15" fill="#3498DB" stroke="#3B2A1E" stroke-width="5"/>
      <rect x="-5" y="15" width="10" height="20" fill="#3498DB" stroke="#3B2A1E" stroke-width="5"/>
    </g>
  </g>
</svg>