<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 468">
  <defs>
    <filter id="whiteOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="8" in="SourceGraphic" result="expanded" />
      <feFlood flood-color="white" />
      <feComposite in2="expanded" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="768" height="468" fill="#F0F8FF"/>
  <rect y="350" width="768" height="118" fill="#A8D08D"/>
  
  <!-- Golfer -->
  <g filter="url(#whiteOutline)" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M250 200 Q250 350 250 400" fill="none" />
    <circle cx="250" cy="150" r="40" fill="#FFD1DC" />
    <path d="M220 140 Q230 130 240 140 M260 140 Q270 130 280 140 M250 165 Q250 175 260 175" fill="none" />
    <path d="M250 200 L280 280 L250 300 L220 280 Z" fill="#4A90E2" />
  </g>

  <!-- Kiosk -->
  <g filter="url(#whiteOutline)" stroke="#3B2A1E" stroke-width="5" fill="#E0E0E0">
    <rect x="450" y="200" width="200" height="200" rx="20" />
    <rect x="480" y="230" width="140" height="100" fill="#BDBDBD" />
  </g>

  <!-- Glowing X Objects -->
  <g filter="url(#whiteOutline)" stroke="#3B2A1E" stroke-width="5" fill="#FFD700">
    <path d="M300 200 L350 250 M300 250 L350 200" stroke-width="10" stroke="#C0C0C0"/>
  </g>

  <!-- Shattering Glass -->
  <g stroke="#3B2A1E" stroke-width="5" fill="none" opacity="0.8">
    <path d="M400 150 L430 350 M440 120 L480 380 M480 180 L520 220" stroke="#00CED1" stroke-dasharray="10 10"/>
    <path d="M420 250 L460 210 L500 260 L440 300 Z" fill="#E0FFFF" stroke="#00CED1"/>
  </g>
</svg>