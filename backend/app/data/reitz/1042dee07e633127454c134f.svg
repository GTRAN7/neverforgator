<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 468">
  <!-- Background -->
  <rect width="768" height="468" fill="#FDF6E3"/>
  <rect x="50" y="50" width="668" height="250" fill="#E6D3A3" stroke="#3B2A1E" stroke-width="5"/>
  <rect x="0" y="300" width="768" height="168" fill="#D1C4E9"/>
  
  <!-- Painting Frame -->
  <rect x="250" y="80" width="268" height="180" fill="#FFCCBC" stroke="#3B2A1E" stroke-width="8"/>
  
  <!-- Ant (Sticker) -->
  <g stroke="#3B2A1E" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="384" cy="120" rx="30" ry="25" fill="#FFF" stroke-width="8"/>
    <ellipse cx="384" cy="120" rx="25" ry="20" fill="#FF5722"/>
    <circle cx="375" cy="115" r="5" fill="#3B2A1E"/>
    <circle cx="393" cy="115" r="5" fill="#3B2A1E"/>
    <path d="M360 100 L340 80 M408 100 L428 80" fill="none" stroke-width="4"/>
  </g>

  <!-- Fishing Poles -->
  <path d="M384 120 L150 200 M384 120 L618 200" fill="none" stroke="#3B2A1E" stroke-width="6"/>

  <!-- Twin Girl 1 -->
  <g transform="translate(100, 250)">
    <circle cx="50" cy="50" r="40" fill="#FFF" stroke-width="8"/>
    <circle cx="50" cy="50" r="35" fill="#81D4FA"/>
    <circle cx="40" cy="40" r="5" fill="#3B2A1E"/>
    <circle cx="60" cy="40" r="5" fill="#3B2A1E"/>
    <path d="M35 60 Q50 70 65 60" fill="none" stroke="#3B2A1E" stroke-width="4"/>
  </g>

  <!-- Twin Girl 2 -->
  <g transform="translate(570, 250)">
    <circle cx="50" cy="50" r="40" fill="#FFF" stroke-width="8"/>
    <circle cx="50" cy="50" r="35" fill="#F48FB1"/>
    <circle cx="40" cy="40" r="5" fill="#3B2A1E"/>
    <circle cx="60" cy="40" r="5" fill="#3B2A1E"/>
    <path d="M35 60 Q50 70 65 60" fill="none" stroke="#3B2A1E" stroke-width="4"/>
  </g>
</svg>